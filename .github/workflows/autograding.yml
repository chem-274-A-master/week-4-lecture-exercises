name: Autograding Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autograding-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autograding:
    name: Grade lecture exercises
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Grade exercises
        run: python .github/scripts/grade.py

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grading-results
          path: grading-results.json
          if-no-files-found: warn
          retention-days: 30
